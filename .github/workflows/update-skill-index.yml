name: Update skill index

on:
  push:
    branches: [main]
    paths-ignore:
      - INDEX.md
      - .skill-index-snapshot.json
  schedule:
    # Mondays 06:00 UTC -- stars move whether or not I deploy.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: skill-index
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh star counts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update_index.py

      - name: Commit if changed
        run: |
          if git diff --quiet -- INDEX.md .skill-index-snapshot.json; then
            echo "No change to the index."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add INDEX.md .skill-index-snapshot.json
          git commit -m "Refresh skill index star counts"
          git push
